name: Build and Publish FitBalance APK

on:
  push:
    branches: [ fitbalance-apk-20261006 ]
    paths:
      - 'fitbalance-android/**'
      - '.github/workflows/build-fitbalance-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local assets
        shell: bash
        run: |
          node --check fitbalance-android/app/src/main/assets/app.js
          node --check fitbalance-android/app/src/main/assets/api-gateway.js
          python - <<'PY'
          import json
          for p in [
              'fitbalance-android/app/src/main/assets/zhuangzi_seed.json',
              'fitbalance-android/app/src/main/assets/health_rules_seed.json',
              'fitbalance-android/app/src/main/assets/api-config.json',
          ]:
              with open(p, 'r', encoding='utf-8') as f:
                  json.load(f)
              print('OK', p)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build standalone APK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          gradle -p fitbalance-android :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp fitbalance-android/app/build/outputs/apk/debug/app-debug.apk FitBalance-Standalone-v1.4.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitBalance-Standalone-APK
          path: FitBalance-Standalone-v1.4.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view fitbalance-v1.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload fitbalance-v1.4.0 FitBalance-Standalone-v1.4.0.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create fitbalance-v1.4.0 FitBalance-Standalone-v1.4.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "动衡 FitBalance v1.4.0 本地规则与报告版" \
              --notes "v1.4.0：新增疾病×食物红黄绿本地规则引擎及证据ID；自定义运动/冥想；训练就绪度恢复曲线；离线交互式人体肌群图；本地周报/月报。核心功能不依赖API。"
          fi

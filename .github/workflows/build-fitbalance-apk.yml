name: Validate and Publish FitBalance Android

on:
  push:
    branches: [ fitbalance-apk-20261006 ]
    paths:
      - 'fitbalance-android/**'
      - '.github/workflows/build-fitbalance-apk.yml'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Build stable-signed APK and publish immutable GitHub Release'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate local assets
        shell: bash
        run: |
          node --check fitbalance-android/app/src/main/assets/app.js
          node --check fitbalance-android/app/src/main/assets/api-gateway.js
          python - <<'PY'
          import json
          for p in [
              'fitbalance-android/app/src/main/assets/zhuangzi_seed.json',
              'fitbalance-android/app/src/main/assets/health_rules_seed.json',
              'fitbalance-android/app/src/main/assets/api-config.json',
          ]:
              with open(p, 'r', encoding='utf-8') as f:
                  json.load(f)
              print('OK', p)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compile validation build
        shell: bash
        env:
          FITBALANCE_GIT_SHA: ${{ github.sha }}
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          gradle -p fitbalance-android :app:assembleDebug --no-daemon --stacktrace

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: FitBalance-v1.5.0-validation-debug
          path: fitbalance-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FITBALANCE_KEYSTORE_BASE64: ${{ secrets.FITBALANCE_KEYSTORE_BASE64 }}
      FITBALANCE_KEYSTORE_PASSWORD: ${{ secrets.FITBALANCE_KEYSTORE_PASSWORD }}
      FITBALANCE_KEY_ALIAS: ${{ secrets.FITBALANCE_KEY_ALIAS }}
      FITBALANCE_KEY_PASSWORD: ${{ secrets.FITBALANCE_KEY_PASSWORD }}
      FITBALANCE_GIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify signing secrets
        shell: bash
        run: |
          test -n "$FITBALANCE_KEYSTORE_BASE64" || { echo "Missing FITBALANCE_KEYSTORE_BASE64"; exit 1; }
          test -n "$FITBALANCE_KEYSTORE_PASSWORD" || { echo "Missing FITBALANCE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$FITBALANCE_KEY_ALIAS" || { echo "Missing FITBALANCE_KEY_ALIAS"; exit 1; }
          test -n "$FITBALANCE_KEY_PASSWORD" || { echo "Missing FITBALANCE_KEY_PASSWORD"; exit 1; }

      - name: Refuse overwrite of historical release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view fitbalance-v1.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "fitbalance-v1.5.0 already exists. Historical releases are immutable."
            exit 1
          fi

      - name: Restore private signing key
        shell: bash
        run: |
          printf '%s' "$FITBALANCE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fitbalance-release.keystore"
          chmod 600 "$RUNNER_TEMP/fitbalance-release.keystore"
          echo "FITBALANCE_KEYSTORE_PATH=$RUNNER_TEMP/fitbalance-release.keystore" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build stable signed release
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          gradle -p fitbalance-android :app:assembleRelease --no-daemon --stacktrace
          cp fitbalance-android/app/build/outputs/apk/release/app-release.apk FitBalance-Standalone-v1.5.0.apk

      - name: Verify APK signature and create audit metadata
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs FitBalance-Standalone-v1.5.0.apk | tee signing-report.txt
          sha256sum FitBalance-Standalone-v1.5.0.apk | tee apk-sha256.txt
          {
            echo "Version: 1.5.0"
            echo "Version code: 6"
            echo "Commit SHA: $GITHUB_SHA"
            echo "Database schemaVersion: 3"
            echo "Rule version: 1"
            echo "Content version: 1"
            echo "Evidence version: 1"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee release-metadata.txt

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitBalance-v1.5.0-stable-signed
          path: |
            FitBalance-Standalone-v1.5.0.apk
            signing-report.txt
            apk-sha256.txt
            release-metadata.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create fitbalance-v1.5.0             FitBalance-Standalone-v1.5.0.apk             signing-report.txt             apk-sha256.txt             release-metadata.txt             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "动衡 FitBalance v1.5.0 稳定签名与迁移基础版"             --notes "v1.5.0 建立长期稳定签名、不可覆盖历史 Release、SQLite schema v3 非破坏迁移、版本审计。注意：v1.0.0-v1.4.0 为云端 debug 签名，无法保证与新的长期 release key 原地覆盖升级；从 v1.5.0 开始使用同一 release key 后，后续版本可按正常 Android 升级链演进。"

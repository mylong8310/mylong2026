name: Build and Publish FitBalance APK

on:
  push:
    branches: [ fitbalance-apk-20261006 ]
    paths:
      - 'fitbalance-android/**'
      - '.github/workflows/build-fitbalance-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build standalone APK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          gradle -p fitbalance-android :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp fitbalance-android/app/build/outputs/apk/debug/app-debug.apk FitBalance-Standalone-v1.0.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitBalance-Standalone-APK
          path: FitBalance-Standalone-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view fitbalance-v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload fitbalance-v1.0.0 FitBalance-Standalone-v1.0.0.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create fitbalance-v1.0.0 FitBalance-Standalone-v1.0.0.apk               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "动衡 FitBalance v1.0.0 独立安装版"               --notes "独立 Android 健身与营养管理 App。包含宏量营养、热量平衡、步数、运动、体重、肌肉恢复、16:8、糖尿病与痛风安全提醒，以及本地照片餐盘估算。"
          fi

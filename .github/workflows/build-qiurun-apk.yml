name: Build Qiurun APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'qiurun-android/**'
      - '.github/workflows/build-qiurun-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build standalone APK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          gradle -p qiurun-android :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp qiurun-android/app/build/outputs/apk/debug/app-debug.apk Qiurun-Standalone-v1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qiurun-Standalone-APK
          path: Qiurun-Standalone-v1.1.0.apk
          if-no-files-found: error
          retention-days: 7

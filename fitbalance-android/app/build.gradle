plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fitbalance.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fitbalance.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
